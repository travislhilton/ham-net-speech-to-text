<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HamNet Station</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#16181d;--muted:#5d6472;--line:#dfe2e8;--accent:#1f6feb;--ok:#1a7f37;
--warn:#9a6700;--warnc:#d4a72c;--warnbg:#fff8c5;--bad:#cf222e;--badbg:#ffebe9;--chip:#eef2ff;--partial:#7d8590;--term:#0969da}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#8b949e;--line:#30363d;
--accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--warnc:#d29922;--warnbg:#3a2f0b;--bad:#ff7b72;--badbg:#3c1618;--chip:#1c2a44;--partial:#8b949e;--term:#79c0ff}}
*{box-sizing:border-box}html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}.clock{font-variant-numeric:tabular-nums;color:var(--muted)}
.net{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.net b{font-size:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--chip)}
.badge.emergency{background:var(--bad);color:#fff;border-color:var(--bad)}.badge.exercise{background:var(--warnbg);color:var(--warn)}
#alert{display:none;padding:10px 16px;background:var(--bad);color:#fff;font-weight:700;font-size:17px}
#radios{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px;align-items:start}
.rcol{display:flex;flex-direction:column;gap:10px;min-width:0}.rcol>section{margin-bottom:0}
.feed{max-height:calc(100dvh - 120px);overflow-y:auto;overscroll-behavior:contain}
/* wide screens: the page itself never scrolls; radios stay put, each transcript and the side panel scroll on their own */
@media (min-width:901px){
  body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  main{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
  #radios{min-height:0;overflow-y:auto;align-items:stretch;grid-auto-rows:minmax(100%,auto)}
  .rcol{min-height:0}.rcol>.logbox{flex:1;min-height:0;display:flex;flex-direction:column}
  .feed{flex:1;min-height:0;max-height:none}
}
#rtabs{display:none}
/* phones / narrow windows: one radio at a time, picked with the tabs under the header */
@media (max-width:900px){
  body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{flex-wrap:wrap;gap:4px 10px}#engine,#nettype,#net{display:none}
  #rtabs{display:flex;gap:6px;padding:6px 12px 0;overflow-x:auto;flex:none}
  #rtabs button{flex:1 0 auto;padding:6px 10px;border-radius:8px 8px 0 0;border-bottom:0;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center}
  #rtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #rtabs .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}#rtabs .dot.rx{background:var(--ok)}#rtabs .dot.em{background:var(--bad)}
  main{flex:1;min-height:0;padding:8px 12px 10px;display:flex;flex-direction:column}
  #radios{flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch}
  .rcol{display:none;flex:1;min-height:0}.rcol.sel{display:flex}
  .rcol>.logbox{flex:1;min-height:0;display:flex;flex-direction:column}

  .feed{flex:1;min-height:0;max-height:none}
  .radio{flex:none}.radio .wf{height:64px;margin-top:6px}.radio .cap{display:none}.radio .axis{height:13px;font-size:10px}
  .radio .sch{display:none}.radio .cardbtns{margin-top:4px}
  .toptabs>.tabs .lg{display:none}.toptabs>.tabs .sm{display:inline}.toptabs>.tabs{overflow-x:auto;scrollbar-width:none}.toptabs>.tabs button{font-size:12px;padding:4px 7px;white-space:nowrap;letter-spacing:0}
  /* more of the log on a phone: tighter rows, the time beside the buttons' column, a one-line header */
  .feed .tx{grid-template-columns:2.9em minmax(0,1fr);gap:2px 6px;padding:6px 0}.feed .tx .t{font-size:12px}
  .logbox>h2{margin:0 0 4px;font-size:12px}.sess{margin:4px 0 2px;padding:4px 8px}
  details.livetext summary .lt{display:none}
  header .xl{display:none}header .xs{display:inline!important}
}
header .xs{display:none}
.logbox>h2{margin-bottom:6px}.guide .empty{margin:0}
/* the top of each column: one tab set (Radio | What you can do now | Stations heard). All three panes share one
   grid cell; the radio card sets its height, the others scroll inside it, so the conversation below never jumps. */
.toptabs{flex:none;padding-top:6px}.toptabs>.tabs{margin-bottom:8px}
.stack{display:grid}.stack>.pane{grid-area:1/1;min-width:0}.stack>.pane:not(.show){visibility:hidden}
.stack>.guide,.stack>.heard{contain:size;overflow-y:auto;overscroll-behavior:contain}
.stack>.radio{border:0;padding:0;background:none;border-radius:0}
.tabs .sm{display:none}
.radio.paused .mrow,.radio.paused .wf,.radio.paused .axis{opacity:.35}.rx.paused{color:#fff;background:var(--muted);padding:0 8px;border-radius:6px}
.text.noise{color:var(--muted);font-style:italic;font-size:14px}
body.noterms .gloss{display:none}body.noterms .term{border-bottom:0;cursor:inherit}
.sess{position:sticky;top:0;z-index:1;display:block;
  background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0 2px}
.sess>summary{list-style:none;display:flex;align-items:baseline;gap:6px;cursor:pointer;min-width:0}
.sess>summary .sum{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .sbody{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.sess:not([open]){padding-top:4px;padding-bottom:4px}
.sess+.tx{border-top:0}
.onair{display:flow-root}.onair>.sess:first-child{margin-top:0}
.sess .sbody{justify-content:flex-start;gap:6px 8px}.sess .acc.ok,.sess .nclose:not(.closed):not(.ask){flex-basis:auto}
/* the log: the net on the air (open, sticky header), or one line for the scheduled net on now / up next; then
   Completed: one collapsed line per earlier net or conversation under a day heading (time · name · status · size) */
.logbox .tag{flex:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:9px;background:var(--accent);color:#fff;vertical-align:1px}
.logbox .tag.on{background:var(--ok)}.logbox .tag.ps{background:var(--warnc);color:#16181d}
.sess.live{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.nowbar{flex:none;margin-bottom:6px}.nowbar[hidden]{display:none}
.nowl{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:baseline;gap:10px;width:100%;padding:6px 10px;border-radius:8px;font-size:14px;white-space:nowrap;overflow:hidden;border:1px solid var(--line);background:var(--chip)}
.nowl .nm{overflow:hidden;text-overflow:ellipsis;min-width:6em;flex:0 1 auto}
.nowl .tt,.nowl .fq{flex:none;font-variant-numeric:tabular-nums;color:var(--muted)}.nowl .tt{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.nowl .note{margin-left:auto;padding-left:6px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.nowl.next{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.nowl.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.nowl.ps{border-color:var(--warnc);background:color-mix(in srgb,var(--warnc) 10%,var(--panel))}
.nowl.quiet{cursor:default;font-size:13px;padding:4px 10px;background:none}
.nowl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.feed .grp{display:flex;align-items:center;gap:6px;margin:16px 0 0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.feed .grp:first-child{margin-top:0}
.feed .grp .n{font-weight:600;border:1px solid var(--line);border-radius:9px;padding:0 6px;letter-spacing:0}
.feed .grp::after{content:"";flex:1;border-top:1px solid var(--line)}
.feed .day{font-size:12px;color:var(--muted);margin:8px 0 2px 4px;font-weight:600}
details.sess.done{position:static;background:none;border:0;border-top:1px solid var(--line);border-radius:0;margin:0;padding:0}
.feed .day+details.sess.done{border-top:0}
details.sess.done>summary{gap:8px;padding:6px 4px;white-space:nowrap;overflow:hidden;border-radius:6px}
details.sess.done>summary:hover{background:var(--chip)}
details.sess.done[open]>summary{position:sticky;top:0;z-index:1;background:var(--chip);box-shadow:0 1px 0 var(--line)}
.sess.done .tt{flex:none;min-width:6.4em;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.sess.done .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sess.done .meta{flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pill{flex:none;font-size:11px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.pill.run{color:var(--accent);border-color:var(--accent)}
.sess.done .txs{padding:0 0 8px 14px}.sess.done .txs>.sbody{margin:6px 0 2px}
/* a paused radio hears nothing: its meters and waterfall fold away (more room for the log) */
.radio.paused .mrow,.radio.paused .wf,.radio.paused .axis,.radio.paused .cap{display:none}
@media (max-width:900px){.sess.done .meta .fq,.nowl .fq,.nowl .te,.sess.done .pill.ok{display:none}#openPhone{display:none}.sess.done .txs{padding-left:0}.sess.done .tt{min-width:0}.nowl{gap:6px;padding:5px 8px}}
/* a transmission the accurate pass is still working on: a thin pulsing bar + "improving…" */
.tx.pending,.feed .tx.pending{padding-left:8px;box-shadow:inset 3px 0 0 var(--accent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 7%,transparent),transparent 45%);animation:accpulse 1.6s ease-in-out infinite}
.phoneqr{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0}
.phoneqr figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:240px;text-align:center}
.phoneqr svg{width:200px;height:200px;background:#fff;border-radius:6px}
.phoneqr code{font-size:13px;word-break:break-all;user-select:all}
.helpbtn{display:inline-block;padding:4px 10px;border:1px solid var(--line,#ccc);border-radius:6px;text-decoration:none;color:inherit;font-size:13px}
.helpbtn:hover{background:rgba(0,0,0,.05)}
.tx.pending .who::after{content:"improving…";font-size:11px;color:var(--muted);margin-left:4px}
@keyframes accpulse{50%{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--accent) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.tx.pending{animation:none}}
.sess .acc{flex-basis:100%;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acc .bar{flex:1 1 120px;max-width:220px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.acc .bar i{display:block;height:100%;background:var(--accent,#2b6cb0)}
.acc.ok{color:var(--ok)}.acc .muted{color:var(--muted)}
/* the end of a net: closed by net control / ended by the operator, End net with its inline confirmation */
.sess .nclose,.radio .endnet .nclose{flex-basis:100%;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nclose.closed{color:var(--ok)}.nclose .muted{color:var(--muted)}.nclose.ask{background:var(--bg,#fff);border:1px solid var(--bad);border-radius:6px;padding:4px 8px}
.radio .endnet:empty{display:none}.radio .endnet{margin:4px 0}
.wlacc{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px}
.wlacc.run{background:var(--chip)}.wlacc.ok{border-color:var(--ok)}
details.livetext{font-size:12px;color:var(--muted);border:0;padding:0;margin:2px 0 0;background:none}details.livetext summary{cursor:pointer;padding:0}
.testref{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0;font-size:16px}
table.hist{border-collapse:collapse;font-size:13px}table.hist td,table.hist th{padding:2px 8px;border-bottom:1px solid var(--line);text-align:left}
/* splitter between the tab group and the conversation: shown on the guidance and stations tabs */
.split{display:none;flex:none;height:12px;margin:-11px 0;cursor:row-resize;touch-action:none;position:relative;z-index:1}
.split::before{content:"";position:absolute;left:50%;top:4px;width:56px;height:4px;margin-left:-28px;border-radius:2px;background:var(--muted);opacity:.6}
.split:hover::before,.split.drag::before{background:var(--accent)}
.rcol.sized .split{display:block}.rcol.sized .stack{grid-template-rows:minmax(0,1fr);overflow:hidden}
body.dragging{user-select:none;cursor:row-resize}
.tabs button .gn{display:inline-block;min-width:8px;height:8px;border-radius:50%;margin-left:4px;vertical-align:middle}
.tabs button .gn.has{background:var(--accent)}.tabs button .gn.high{background:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:4px 10px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.sch{margin-top:4px;font-size:13px}.sch .now{font-weight:700;color:var(--ok)}.cardbtns{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.hsearch{display:flex;gap:4px;align-items:center;margin:0}#q{width:200px;text-transform:none}
.radio{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.radio .top{display:flex;justify-content:space-between;align-items:center;gap:8px}.radio .top .nm{flex:1}
.rx{font-weight:700;color:var(--muted);font-size:13px}.rx.on{color:#fff;background:var(--ok);padding:0 8px;border-radius:6px}
.mrow{display:grid;grid-template-columns:48px minmax(0,1fr) 74px;gap:8px;align-items:center;margin-top:7px;font-size:13px}
.ml{color:var(--muted)}.mv{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.bar{position:relative;height:14px;border-radius:4px;background:var(--line);overflow:hidden}
.bar .z{position:absolute;top:0;bottom:0;opacity:.22}.bar .z.ok{background:var(--ok)}.bar .z.warn{background:var(--warnc)}.bar .z.bad{background:var(--bad)}
.bar .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;width:0;transition:width .08s linear;background:var(--muted)}
.bar .fill.ok{background:var(--ok)}.bar .fill.warn{background:var(--warnc)}.bar .fill.bad{background:var(--bad)}.bar .fill.idle{background:var(--muted)}
.bar .pk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);left:0}
.mv.ok{color:var(--ok)}.mv.warn{color:var(--warn)}.mv.bad{color:var(--bad)}.mv.idle{color:var(--muted)}
.wf{display:block;width:100%;height:120px;margin-top:9px;border-radius:6px;background:#080c28;image-rendering:auto}
.axis{position:relative;height:16px;font-size:11px;color:var(--muted)}.axis span{position:absolute;transform:translateX(-50%)}.axis span:first-child{transform:none}
dialog{max-width:min(860px,96vw);width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog label{display:block;margin:8px 0 2px;font-size:14px}dialog label input,dialog select{display:block;margin-top:3px}
dialog select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);max-width:100%}
dialog textarea{width:100%;font:13px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:6px}
dialog h3{margin:0 0 8px}dialog h4{margin:12px 0 4px;font-size:14px;color:var(--muted);text-transform:uppercase}
.row{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chk{display:flex!important;gap:6px;align-items:center;margin:3px 0!important}
.chk input{display:inline!important;margin:0!important;width:auto}.tolist{max-height:180px;overflow:auto}
details{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0}summary{cursor:pointer}
table.log{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}table.log td,table.log th{border-top:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}input[type=datetime-local]{width:auto;text-transform:none}
.err{color:var(--bad);font-size:13px}.tune{font-size:12px;padding:0 6px;margin-left:4px}.tuneform{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tuneform input{width:110px;text-transform:none}.tuneform select{font:inherit;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:10px 16px 24px}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}header{padding:8px 12px}main{padding-left:12px;padding-right:12px}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
section h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px}
.tx{border-top:1px solid var(--line);padding:9px 2px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px}
.tx:first-of-type{border-top:0}.tx .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.tx .who{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.call{font-weight:700;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:0 6px;cursor:pointer;font-family:ui-monospace,Consolas,monospace}
.call.spk{border-color:var(--accent)}
.spkr{font-weight:700;font-family:ui-monospace,Consolas,monospace;cursor:pointer}.spkr.inf{font-weight:400;color:var(--muted)}
.spkr.op::after{content:" ✎";color:var(--muted);font-weight:400}.whob{font-size:12px;padding:0 6px;color:var(--muted)}
.maybe{font-size:12px;color:var(--muted);display:inline-flex;gap:3px;align-items:center;margin-left:4px}.maybe .call{font-size:11px;opacity:.75}
.call.fixed,.spkr.fixed{text-decoration:underline dotted;text-underline-offset:3px}.text{font-size:16px;overflow-wrap:anywhere}.text.partial{color:var(--partial);font-style:italic}
.live{color:var(--ok);font-weight:600}.term{border-bottom:2px dotted var(--term);cursor:help}
.terms{font-size:13px;color:var(--muted)}.terms b{color:var(--term)}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}.card.high{border-color:var(--bad);background:var(--badbg)}
.card h3{font-size:15px;margin:0 0 4px}.card ol{margin:4px 0 6px 18px;padding:0}.say{overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--bg);border-radius:6px;padding:4px 6px;margin:3px 0;display:flex;justify-content:space-between;gap:6px}
.rem{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;margin-bottom:8px;font-weight:600}
.st{display:grid;grid-template-columns:auto 1fr;gap:0 10px;font-size:13px}.st dt{color:var(--muted)}.st dd{margin:0;overflow-wrap:anywhere}
.station{border-top:1px solid var(--line);padding:8px 0}.station:first-of-type{border-top:0}
.station .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
/* Stations heard: one line per station, details on expand */
details.hrow{border:0;border-top:1px solid var(--line);border-radius:0;margin:0;padding:0}details.hrow:first-of-type{border-top:0}
.hrow .station>.hd{display:none}
/* phone: tap the open tab again to fold the radio panel down to its tab bar (more room for the log) */
.rcol.folded .stack,.rcol.folded .split{display:none!important}.rcol.folded .toptabs>.tabs{margin-bottom:0}
.toptabs>.tabs .fold{margin-left:auto;font-size:13px;color:var(--muted);border:0;background:none}
.toptabs>.tabs .fold::after{content:"▴ Hide"}.rcol.folded .toptabs>.tabs .fold::after{content:"▾ Show"}
.rcol.folded .toptabs>.tabs button.on{border-bottom-color:transparent}
details.hrow>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:6px 2px;cursor:pointer;min-width:0}
details.hrow>summary::-webkit-details-marker,details.sess>summary::-webkit-details-marker{display:none}
details.hrow>summary::before,details.sess>summary::before{content:"▸";color:var(--muted);flex:none;width:10px}
details.hrow[open]>summary::before,details.sess[open]>summary::before{content:"▾"}
.hrow .who{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}

setInterval(tick,1000);tick();

function markTerms(text,terms){

function setFold(rid,f){$("col-"+rid).classList.toggle("folded",f);try{localStorage.setItem("hamnet.fold."+rid,f?"1":"")}catch(e){}}
function applySplit(rid,tab){
  const col=$("col-"+rid),st=col.querySelector(".stack");
  if(tab==="radio"){col.classList.remove("sized");st.style.height="";return}
  let h=null;try{h=+localStorage.getItem(splitKey(rid))||null}catch(e){}
  col.classList.remove("sized");st.style.height="";          // measure the card at its natural height first
  const natural=st.offsetHeight;
  col.classList.add("sized");st.style.height=(h||natural)+"px";
}
function splitBounds(col){const top=col.querySelector(".toptabs"),st=col.querySelector(".stack");
  const chrome=top.offsetHeight-st.offsetHeight;  // tab bar + padding
  return [60,Math.max(60,col.clientHeight-chrome-220)]}       // keep at least ~150 px of conversation
document.addEventListener("pointerdown",e=>{
  const sp=e.target.closest(".split");if(!sp)return;
  e.preventDefault();sp.setPointerCapture(e.pointerId);
  const col=$("col-"+sp.dataset.rid),st=col.querySelector(".stack"),y0=e.clientY,h0=st.offsetHeight,[lo,hi]=splitBounds(col);
  sp.classList.add("drag");document.body.classList.add("dragging");
  const move=ev=>{st.style.height=Math.round(Math.min(hi,Math.max(lo,h0+ev.clientY-y0)))+"px"};
  const up=()=>{sp.classList.remove("drag");document.body.classList.remove("dragging");sp.removeEventListener("pointermove",move);
    try{localStorage.setItem(splitKey(sp.dataset.rid),parseInt(st.style.height))}catch(err){}};
  sp.addEventListener("pointermove",move);sp.addEventListener("pointerup",up,{once:true});sp.addEventListener("pointercancel",up,{once:true});
});
document.addEventListener("dblclick",e=>{const sp=e.target.closest(".split");if(!sp)return;
  try{localStorage.removeItem(splitKey(sp.dataset.rid))}catch(err){}
  const tab=($("col-"+sp.dataset.rid).querySelector(".toptabs .on")||{}).dataset?.tab||"guide";applySplit(sp.dataset.rid,tab)});
// "Explain radio terms" (on by default; remembered per browser)
(()=>{const cb=$("explain");let on=true;try{on=localStorage.getItem("hamnet.explain")!=="0"}catch(e){}
  const apply=()=>{document.body.classList.toggle("noterms",!cb.checked);try{localStorage.setItem("hamnet.explain",cb.checked?"1":"0")}catch(e){}};
  cb.checked=on;apply();cb.onchange=apply})();
let SEL=null;try{SEL=localStorage.getItem("hamnet.radio")}catch(e){}
function selectRadio(id){SEL=id;try{localStorage.setItem("hamnet.radio",id)}catch(e){}
  document.querySelectorAll(".rcol").forEach(c=>c.classList.toggle("sel",c.id==="col-"+id));
  document.querySelectorAll("#rtabs button").forEach(b=>{b.classList.toggle("on",b.dataset.r===id);b.setAttribute("aria-selected",b.dataset.r===id)})}
function renderRtabs(){
  const nav=$("rtabs");if(!S.radios.length){nav.innerHTML="";return}
  if(!S.radios.some(r=>r.id===SEL))SEL=S.radios[0].id;
  const have=[...nav.children].map(b=>b.dataset.r).join(),want=S.radios.map(r=>r.id).join();
  if(have!==want)nav.innerHTML=S.radios.map(r=>`<button role="tab" data-r="${esc(r.id)}"><i class="dot" id="dot-${esc(r.id)}"></i>${esc(r.name)}</button>`).join("");
  for(const r of S.radios){const h=(S.hints||{})[r.id]||{},d=$("dot-"+r.id);if(d)d.classList.toggle("em",(h.net||{}).type==="emergency")}
  selectRadio(SEL);
}
function renderRadios(){
  const box=$("radios");
  if(!S.radios.length){box.innerHTML='<div class="radio">No radios set up yet. Add one to <code>config\\station.yaml</code> (see README, "Connecting a radio").</div>';return}
  box.querySelectorAll(":scope>.radio").forEach(x=>x.remove());
  const ids=new Set(S.radios.map(r=>r.id));box.querySelectorAll(".rcol").forEach(x=>{if(!ids.has(x.id.slice(4)))x.remove()});
  renderRtabs();
  for(const r of S.radios){
    const el=ensureCard(r),h=(S.hints||{})[r.id]||{},net=h.net||{};
    el.querySelector(".nm").textContent=r.name;
    const nb=el.querySelector(".nb");nb.textContent=net.type&&net.type!=="unknown"?net.label:"";nb.className="nb badge "+(net.type||"");nb.style.display=nb.textContent?"":"none";
    if(!(document.activeElement&&document.activeElement.closest("#r-"+CSS.escape(r.id)+" .tuneform"))){
      el.querySelector(".fq").innerHTML=`<b>${r.freq_mhz?Number(r.freq_mhz).toFixed(3)+" MHz":"frequency not set"}</b> <span class="muted">${r.band&&r.band.band?esc(r.band.band):""} · ${esc(r.mode||"")} · ${r.gate==="carrier"?"carrier gate":"voice gate"}</span>
        <button class="tune" data-tune="${esc(r.id)}" title="Set what this radio is tuned to">Change</button>`;
      el.querySelector(".tunebox").innerHTML=editing===r.id?`<form class="tuneform" data-rid="${esc(r.id)}"><input name="f" inputmode="decimal" value="${r.freq_mhz??""}" aria-label="Frequency in MHz"> MHz
        <select name="m">${["FM","USB","LSB","AM","CW","DIG"].map(m=>`<option${m===r.mode?" selected":""}>${m}</option>`).join("")}</select>
        <button type="submit">Save</button> <button type="button" data-cancel>Cancel</button> <span class="err tuneerr"></span>
        <div class="muted small">Set this to what you tuned the radio to. Every transmission is logged with it.</div></form>`:"";
    }
    el.querySelector(".cap").textContent=wfCaption(r);
    const run=(S.net||{}).running||[],nets=(S.schedule||[]).filter(n=>n.radio===r.id);
    el.querySelector(".sch").innerHTML=nets.length?"Nets: "+nets.map(n=>{const on=run.some(x=>x.id===n.id);return `<span class="${on?"now":""}" title="${esc(n.summary||"")}">${on?"now: ":""}${esc(n.name)}${!on&&n.next?" · next "+esc(fmtWhen(n.next.start)):""}${n.freq_mhz?" · "+esc(Number(n.freq_mhz).toFixed(3))+" MHz":""}</span>`}).join("; "):'<span class="muted">No nets scheduled on this radio.</span>';
    el.querySelector(".err").textContent=r.paused?"":(r.error||"");
    el.classList.toggle("paused",!!r.paused);
    const pz=el.querySelector(".pz");pz.textContent=r.paused?"▶ Resume":"⏸ Pause";
    pz.title=r.paused?"Start listening to this radio again":"Stop listening to this radio: nothing is recorded or transcribed until you resume. Its scheduled nets are still recorded (resumed 1 min before, paused again after).";
    pz.classList.toggle("primary",!!r.paused);
    if(r.paused){const rx=el.querySelector(".rx");rx.textContent="PAUSED";rx.className="rx paused"}
    if(!r.paused&&r.state!=="listening"){el.querySelector(".rx").textContent=r.state==="error"?"no audio":r.state;el.querySelector(".rx").className="rx"}
    renderWhy(el,r);   // schedule
    renderEndNet(el,r);   // End net / closed by net control
  }
}
function onMeter(d){
  const el=document.getElementById("r-"+d.id);if(!el)return;
  const dot=$("dot-"+d.id);if(dot)dot.classList.toggle("rx",!!d.rx);
  const rx=el.querySelector(".rx");rx.textContent=d.rx?"RX":"idle";rx.className="rx"+(d.rx?" on":"");
  const bars=el.querySelectorAll(".bar");
  const f=bars[0].querySelector(".fill");f.style.width=pc(d.rms,LV)+"%";f.className="fill "+d.ls;
  bars[0].querySelector(".pk").style.left=pc(d.peak,LV)+"%";
  el.querySelector(".lv").textContent=`${d.rms.toFixed(0)} dBFS`;el.querySelector(".lv").className="mv lv "+d.ls;
  el.querySelector(".lv").title=d.ls==="ok"?"in bounds":d.peak>=-1?"clipping: turn the radio's data/audio level down":d.rms<-60?"almost no audio: check the cable and level":d.peak>=-6?"hot: close to clipping":"low: turn the level up";
  const s=bars[1].querySelector(".fill");s.style.width=(d.snr==null?0:pc(d.snr,SN))+"%";s.className="fill "+d.ss;
  el.querySelector(".sv").textContent=d.snr==null?"—":(d.rx?`${d.snr.toFixed(0)} dB`:"idle");el.querySelector(".sv").className="mv sv "+d.ss;
  const cv=el.querySelector("canvas"),c=cv.getContext("2d"),w=cv.width,h=cv.height;
  c.drawImage(cv,0,0,w,h-1,0,1,w,h-1);
  const row=atob(d.s),img=c.createImageData(w,1);
  for(let i=0;i<w;i++){const v=row.charCodeAt(i)*3;img.data[i*4]=LUT[v];img.data[i*4+1]=LUT[v+1];img.data[i*4+2]=LUT[v+2];img.data[i*4+3]=255}
  c.putImageData(img,0,0);
}
function renderNet(){
  const n=S.net||{},c=n.current,x=n.next;
  let h="";
  if(c) h=`<b>${esc(c.name)}</b>${c.overrun?'<span class="badge" title="Past its scheduled end and still going: recording until net control closes it, it goes quiet for 5 minutes, or the next net on this radio">running over</span>':""}<span>${freq(c.band)}</span>${c.radio_name?`<span class="muted">on ${esc(c.radio_name)}</span>`:""}${c.ncs?`<span class="muted">NCS ${esc(c.ncs)}</span>`:""}${c.retune?`<span class="badge exercise">Set the radio to ${esc(Number(c.freq_mhz).toFixed(3))} MHz</span>`:""}<button class="linkish small" data-goto="open" data-net="${esc(c.id)}">Still open ›</button>`;
  else if(x) h=`<span class="muted">Next net:</span> <button class="linkish" data-goto="schedule" data-net="${esc(x.id)}"><b>${esc(x.name)}</b></button> <span class="muted">${esc(fmtWhen(x.start))} · ${freq(x.band)}</span>`;
  else h='<span class="muted">No net scheduled</span>';
  $("net").innerHTML=h;
  renderToday();
  for(const r of S.radios)renderNow(r.id);
}
// Today: one line per net still to come today (and the one on the air), the next one highlighted
function renderToday(){
  const L=(S.net||{}).today||[],box=$("today");
  if(!L.length){box.innerHTML="";return}
  const hm=s=>new Date(s).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  const mhz=x=>x.freq_mhz?`${Number(x.freq_mhz).toFixed(3)} ${esc(x.mode||"")}`:"";
  box.innerHTML=`<div class="th">Nets today</div>`+L.map(x=>{
    const rp=(S.radios.find(r=>r.id===x.radio)||{}).paused;   // on the air but its radio is paused = not recording
    const cls=x.skipped?"skip":x.state==="on"&&rp?"later":x.state,tag=x.state==="on"?(rp?"radio paused":x.overrun?"running over":"on the air"):x.state==="next"&&!x.skipped?"next":"";
    return `<button class="tn ${cls}" data-goto="schedule" data-net="${esc(x.id)}" title="${esc(x.name)} · ${hm(x.start)}–${hm(x.end)}${x.skipped?" · skipped":""} — open in Nets">
      <span class="tt">${hm(x.start)}<span class="te">–${hm(x.end)}</span></span><span class="nm">${esc(x.name)}</span><span class="fq">${mhz(x)}</span>${x.radio_name?`<span class="rd">${esc(x.radio_name)}</span>`:""}${tag?`<span class="tag${tag==="radio paused"?" ps":""}">${tag}</span>`:""}</button>`}).join("")}
function renderHints(){
  const H=S.hints||{},radios=S.radios.length?S.radios:[];
  const name=id=>(radios.find(r=>r.id===id)||{}).name||id;
  const emerg=Object.entries(H).filter(([id,h])=>h.net&&h.net.type==="emergency").map(([id])=>name(id));
  const al=$("alert");
  if(emerg.length){al.style.display="block";al.textContent=`Emergency traffic heard on ${emerg.join(" and ")}. Keep the frequency clear unless you can help or net control calls you.`}else al.style.display="none";
  const types=Object.values(H).map(h=>h.net).filter(n=>n&&n.type&&n.type!=="unknown");
  const nt=$("nettype");nt.textContent=types.length===1?types[0].label:types.length>1?`${types.length} nets heard`:"Net type: listening…";
  nt.className="badge "+(emerg.length?"emergency":types.length===1?types[0].type:"");
  for(const r of S.radios)renderGuide(r.id);
  renderRadios();
}
function renderGuide(rid){
  const g=document.getElementById("guide-"+rid);if(!g)return;
  const h=(S.hints||{})[rid]||{};
  const rem=(h.reminders||[]).map(r=>`<div class="rem">${esc(r.text)}</div>`).join("");
  const cards=(h.cards||[]).map(c=>`<div class="card ${c.priority==="high"?"high":""}"><h3>${esc(c.title)}</h3><ol>${(c.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${(c.say||[]).map(s=>`<div class="say"><span>${esc(s)}</span></div>`).join("")}</div>`).join("");
  const dot=document.querySelector(`#col-${CSS.escape(rid)} .gn`);
  if(dot)dot.className="gn"+((h.cards||[]).some(c=>c.priority==="high")?" high":(h.cards||[]).length||(h.reminders||[]).length?" has":"");
  g.innerHTML=`${rem}${cards||'<p class="muted small empty">Guidance appears here when something on this radio calls for it: a relay request, emergency traffic, check-ins, formal messages.</p>'}`;
}
function cardHtml(c,e){
  const rows=[["Name",c.name],["Location",[c.city,c.state,c.country].filter(Boolean).join(", ")],["License",c.license_class?`${c.license_class}${c.license_status&&c.license_status!=="Active"?" ("+c.license_status+")":""}${c.expires?", expires "+c.expires:""}`:""],
    ["Club",c.club?("yes"+(c.trustee?", trustee "+c.trustee:"")):""],["Grid",c.grid],["Zones",c.cq_zone?`CQ ${c.cq_zone}, ITU ${c.itu_zone}, ${c.continent}`:""],["Email",c.email],["Address",c.address]].filter(r=>r[1]);
  return `<div class="station"><div class="hd"><span class="call" data-call="${esc(c.call)}">${esc(c.call)}</span>${e?`<span class="muted small">heard ${e.count}× · last ${hhmm(e.last)}</span>`:""}</div>
   <dl class="st">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
   <div class="small muted">${(c.sources||[]).join(" · ")||"not found in the callbooks"}${c.qrz_url?` · <a href="${esc(c.qrz_url)}" target="_blank" rel="noopener">QRZ page</a>`:""}</div></div>`;
}
function heardRow(rid,c,e){
  const tc=x=>String(x||"").toLowerCase().replace(/\b[a-z]/g,m=>m.toUpperCase());
  const where=[tc(c.city),c.state,c.country==="United States"||(!c.country&&c.state)?"USA":c.country].filter(Boolean).join(", ");
  const k=rid+"|"+c.call;
  return `<details class="hrow" data-hk="${esc(k)}"${HEARD_OPEN.has(k)?" open":""}><summary><span class="call">${esc(c.call)}</span>`+
    `<span class="who">${esc(where)}${c.name&&where?" · ":""}<span class="muted">${esc(tc(c.name))}</span>${!c.name&&!where?'<span class="muted">not in the callbooks</span>':""}</span>`+
    `<span class="n">${e.count}× ${hhmm(e.last)}</span></summary>${cardHtml(c,e)}</details>`;
}
function renderHeard(rid){
  const cards=Object.fromEntries((S.heard||[]).map(e=>[e.call,e.card]));
  for(const r of S.radios){
    if(rid&&r.id!==rid)continue;
    const box=document.getElementById("heard-"+r.id);if(!box)continue;
    const seen={};
    for(const t of S.tx){if(t.radio!==r.id||t.status!=="final")continue;
      for(const c of callsOf(t)){const s=seen[c]||(seen[c]={call:c,count:0,last:t.start});s.count++;if(t.start>s.last)s.last=t.start}}
    const list=Object.values(seen).sort((a,b)=>b.last.localeCompare(a.last));
    box.innerHTML=list.length?list.map(e=>heardRow(r.id,cards[e.call]||{call:e.call},e)).join(""):'<p class="muted small">None yet.</p>';
    const n=document.querySelector(`#col-${CSS.escape(r.id)} .hn`);if(n)n.textContent=list.length?`(${list.length})`:"";
  }
}

// ---------- settings ----------
let OP=null;
async function loadSettings(){OP=await (await fetch("/api/settings")).json();return OP}
function fillAccounts(f){
  const inst=(OP.installs||[]).find(i=>i.path===f.winlink_dir.value);
  f.winlink_account.innerHTML=(inst?inst.accounts:[]).map(a=>`<option${a===OP.winlink_account?" selected":""}>${esc(a)}</option>`).join("");
}
$("openSettings").onclick=async()=>{
  const op=await loadSettings(),f=$("setForm");
  f.callsign.value=op.callsign||"";f.name.value=op.name||"";f.grid.value=op.grid||"";
  f.winlink_dir.innerHTML=(op.installs||[]).map(i=>`<option value="${esc(i.path)}"${i.path===op.winlink_dir?" selected":""}>${esc(i.path)}${i.active?" (active "+esc(i.active)+")":""}</option>`).join("");
  $("wlNone").textContent=(op.installs||[]).length?"":"No Winlink Express found on this PC (looked in C:\\RMS Express and the installed-programs list).";
  fillAccounts(f);$("setErr").textContent="";renderAlertSettings();renderLearned();$("settings").showModal();
};
$("setForm").winlink_dir.onchange=()=>fillAccounts($("setForm"));
$("setSave").onclick=async e=>{
  e.preventDefault();const f=$("setForm");
  const r=await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({callsign:f.callsign.value,name:f.name.value,grid:f.grid.value,winlink_dir:f.winlink_dir.value,winlink_account:f.winlink_account.value})});
  const d=await r.json();if(!r.ok){$("setErr").textContent=d.error||"not saved";return}
  OP=d;$("me").textContent=d.callsign+" station";$("settings").close();
};
// ---------- Winlink ----------
let WL=null;
async function wlPreview(body){
  $("wlBody").innerHTML='<p>Preparing…</p>';if(!$("wl").open)$("wl").showModal();
  const r=await fetch("/api/winlink/preview",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){$("wlBody").innerHTML=`<p class="bad">${esc(d.error||"could not prepare")}</p><button onclick="$('wl').close()">Close</button>`;return}
  WL=d;renderWl();
}
function renderWl(){
  const d=WL,op=d.operator;
  const warn=!op.winlink_dir?'<p class="bad">Set your Winlink Express folder in Settings first.</p>':op.express_running?'<p class="rem">Winlink Express is open. Close it before putting messages in the Outbox.</p>':"";
  const to=d.to.map(p=>`<label class="chk"><input type="checkbox" name="to" value="${esc(p.call)}"${p.confirmed?" checked":""}> <b>${esc(p.call)}</b> ${esc(p.name||"")} <span class="muted">${p.confirmed?"":p.lapsed?`(licence ${esc(String(p.lapsed).toLowerCase())}: check it)`:"(not in any callbook: check it)"}</span></label>`).join("")||'<p class="muted">No callsigns were identified.</p>';
  const forms=d.drafts.map((f,i)=>{
    const body=f.form==="ics213"?`<label>Subject <input data-i="${i}" data-k="Subjectline" value="${esc(f.values.Subjectline)}" style="text-transform:none;width:100%"></label><label>Message<textarea data-i="${i}" data-k="Message" rows="9">${esc(f.values.Message)}</textarea></label>`
      :`<label>Title <input data-i="${i}" data-k="Title" value="${esc(f.values.Title)}" style="text-transform:none;width:100%"></label><table class="log"><tr><th>Time</th><th>From</th><th>To</th><th>Subject</th></tr>${f.rows.map(r=>`<tr><td>${esc(r.time.slice(11))}</td><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td>${esc(r.sub)}</td></tr>`).join("")}</table>`;
    return `<details open><summary><label class="chk"><input type="checkbox" name="form" value="${i}" checked> ${esc(f.label)}</label></summary>${body}</details>`}).join("");
  $("wlBody").innerHTML=`<h3>Winlink messages</h3>${warn}<div id="wlAcc" class="wlacc"></div>
   <div class="small">From <input type="datetime-local" step="1" id="wlS" value="${esc(d.start)}"> to <input type="datetime-local" step="1" id="wlE" value="${esc(d.end)}"> <button id="wlRe">Update</button> <span class="muted">${d.count} transmissions</span></div>
   <p class="small muted">Sending as <b>${esc(op.winlink_account||"?")}</b> from ${esc(op.winlink_dir||"?")}.</p>
   <h4>To <span class="tocount muted small"></span></h4>
   <div class="small" style="margin-bottom:4px"><button type="button" id="toNone">Uncheck all</button> <button type="button" id="toAll">Check all</button> <button type="button" id="toConf">Only callbook-confirmed</button></div>
   <div class="tolist">${to}</div><div class="small">Add: <input id="wlAdd" maxlength="11" placeholder="callsign"> <button id="wlAddB">Add</button></div>
   <h4>Forms</h4>${forms}
   <div class="row"><button id="wlSend" class="primary">Put in Winlink Express Outbox</button> <button onclick="$('wl').close()">Close</button> <span id="wlMsg"></span></div>`;
  const box=$("wlBody"),toBoxes=()=>[...box.querySelectorAll("input[name=to]")];
  const count=()=>{const n=toBoxes().filter(x=>x.checked).length;box.querySelector(".tocount").textContent=`(${n} of ${toBoxes().length} checked)`};
  const setAll=f=>{toBoxes().forEach(x=>{x.checked=f(x)});count()};
  box.querySelector("#toNone").onclick=()=>setAll(()=>false);
  box.querySelector("#toAll").onclick=()=>setAll(()=>true);
  box.querySelector("#toConf").onclick=()=>setAll(x=>!!(d.to.find(p=>p.call===x.value)||{}).confirmed);
  box.querySelector(".tolist").addEventListener("change",count);count();wlAccNote();
  $("wlRe").onclick=()=>wlPreview({radio:d.radio,start:$("wlS").value,end:$("wlE").value});
  $("wlAddB").onclick=()=>{const c=$("wlAdd").value.trim().toUpperCase();if(!/^[A-Z0-9]{3,8}(-\d{1,2})?$/.test(c))return;
    const keep=new Set(toBoxes().filter(x=>x.checked).map(x=>x.value));keep.add(c);
    if(!d.to.some(p=>p.call===c))d.to.push({call:c,name:"",confirmed:true});renderWl();
    toBoxes().forEach(x=>{x.checked=keep.has(x.value)});count()};
  $("wlBody").querySelectorAll("[data-k]").forEach(el=>el.oninput=()=>{d.drafts[+el.dataset.i].values[el.dataset.k]=el.value});
  $("wlSend").onclick=async()=>{
    const to=[...$("wlBody").querySelectorAll("input[name=to]:checked")].map(x=>x.value);
    const drafts=[...$("wlBody").querySelectorAll("input[name=form]:checked")].map(x=>d.drafts[+x.value]);
    const m=$("wlMsg");m.className="";m.textContent="Writing…";
    const r=await fetch("/api/winlink/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to,drafts,radio:d.radio,start:d.start})});
    const res=await r.json();
    if(!r.ok){m.className="bad";m.textContent=res.error||"not written";return}
    m.className="ok";m.textContent=`${res.written.length} message(s) are in the ${res.account} Outbox. Open Winlink Express to check them, then connect to send.`;

{const _raw=renderFeed;let wait=null,rids=new Set();
  const _rf=function(rid){ // a rebuild keeps the open ✎ Fix editor: the very same element, so its text, cursor and focus
    const ed=document.querySelector(".feed .fixer"),had=ed&&ed.contains(document.activeElement);
    const ta=ed&&ed.querySelector("textarea"),sel=ta?[ta.selectionStart,ta.selectionEnd]:null;
    const out=_raw(rid);

      if(nu&&nu!==ed){nu.replaceWith(ed);if(had&&ta){ta.focus({preventScroll:true});ta.setSelectionRange(sel[0],sel[1])}}}

  renderFeed=function(rid){

      if(!wait)wait=setTimeout(function again(){if(POINTER_DOWN||Date.now()-LAST_TOUCH<700){wait=setTimeout(again,250);return}

      return}

  $("mNotes").onblur=e=>saveMin({notes:e.target.value},true);
  $("attAdd").onsubmit=e=>{e.preventDefault();const c=e.target.call.value.trim().toUpperCase();if(c)saveMin({add:c})};
  $("mWl").onclick=()=>wlPreview({radio:d.radio,start:d.start,end:d.end});
  // the text is fetched ahead, so the copy happens inside the click (browsers only allow a copy during the click itself)
  let mtxt=null;fetch(`/api/history/minutes?key=${enc(d.key)}&format=txt`).then(r=>r.text()).then(x=>{mtxt=x}).catch(()=>{});
  $("mCopy").onclick=async()=>{const b=$("mCopy");
    if(mtxt==null){try{mtxt=await (await fetch(`/api/history/minutes?key=${enc(d.key)}&format=txt`)).text()}catch(e){b.textContent="Could not load";return}}
    const ok=await copyText(mtxt);
    if(ok){b.textContent="Copied ✓";setTimeout(()=>{if(b.isConnected)b.textContent="Copy as text"},2500);return}
    // last resort: show the text, selected, to copy by hand
    b.insertAdjacentHTML("afterend",`<textarea class="mcopybox" rows="8" readonly style="width:100%;margin-top:6px">${esc(mtxt)}</textarea><div class="small muted">Select all and copy (Cmd+C / long-press → Copy).</div>`);
    const box=b.parentElement.querySelector(".mcopybox");box.focus();box.select()};
  if(keep){keep.open.forEach(id=>{const x=$(id);if(x)x.open=true});$("netsBody").scrollTop=keep.top}
  if(FIX&&FIX.where==="min"){const det=$("mTx");if(det)det.open=true;fixFocus()}
  if(NV.hl){const el=$("mtx-"+NV.hl);if(el){el.classList.add("flash");el.scrollIntoView({block:"center"})}NV.hl=null}
}
async function saveMin(body,quiet){
  try{MIN=await post("/api/history/minutes",{key:NV.key,...body});if(quiet){$("mNotesSt").textContent="Saved ✓"}else renderMinutes()}
  catch(err){alert(err.message)}}
// ----- Still open -----
async function renderOpen(){
  const box=$("netsBody");busy(box);let d;
  try{d=await api("/api/nets/open"+(NV.net?"?net="+enc(NV.net):""))}catch(err){box.innerHTML=`<p class="err">${esc(err.message)}</p>`;return}
  const sec=(k,label,its)=>its.length?`<section class="msec k-${k}"><h4>${label} <span class="muted">(${its.length})</span></h4><ul class="items">${its.map(i=>itemHtml(i,{from:true})).join("")}</ul></section>`:"";

    (n?sec("urgent","Urgent, still open",d.urgent)+sec("announcement","Announcements still valid",d.announcements)+sec("event","Coming up",d.upcoming)+sec("action","Open action items",d.actions)+sec("traffic","Traffic not yet handled",d.traffic)
      :`<div class="empty"><b>Nothing open${NV.net?" for this net":""}.</b><br>Announcements, upcoming events and action items from the minutes show here until they are done or out of date.</div>`);
}
// ----- shared clicks in the Nets area, search results and the urgent boards -----
document.addEventListener("click",async e=>{
  const o=e.target.closest("[data-nets]");if(o)openNets(o.dataset.nets);
  const g=e.target.closest("[data-goto]");if(g){NV.tab=g.dataset.goto;if(g.dataset.net!==undefined)NV.net=g.dataset.net;if(NV.tab==="minutes")NV.key=null;openNetsArea({tab:NV.tab,net:NV.net,radio:NV.tab==="schedule"?NV.radio:null});return}
  const mi=e.target.closest("[data-mins]");if(mi){const k=mi.dataset.mins;openNetsArea({tab:"minutes",key:k,hl:mi.dataset.hl||null,net:k.includes("@")&&!/T\d/.test(k)?k.split("@")[0]:NV.net});return}
  const ed=e.target.closest("[data-netedit]");if(ed){NV.edit=ed.dataset.netedit;NV.adding=false;renderSchedule(true);return}
  const del=e.target.closest("[data-netdel]");if(del){const n=(S.schedule||[]).find(x=>x.id===del.dataset.netdel)||{};
    if(confirm(`Delete the net "${n.name}"?\n\nIts history and minutes are kept.`)){try{const d=await post(`/api/schedule/${enc(del.dataset.netdel)}/delete`,{});S.schedule=d.schedule;renderNetPick();renderSchedule(true);renderRadios()}catch(err){alert(err.message)}}}
  const src=e.target.closest("[data-src]");if(src){const id=src.dataset.src;
    if(src.dataset.sinst&&MIN&&MIN.key===src.dataset.sinst&&$("netsDlg").open&&NV.tab==="minutes"){const el=$("mtx-"+id);if(el){$("mTx").open=true;el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");el.scrollIntoView({block:"center",behavior:"smooth"})}}
    else jumpTo(id,src.dataset.sinst,src.dataset.radio);return}
  const done=e.target.closest("[data-idone]");if(done){await setItem(done.dataset.idone,{status:done.checked?"done":"open"});return}
  const stt=e.target.closest("[data-istatus]");if(stt){await setItem(stt.dataset.istatus,{status:stt.dataset.v});return}
  const dl=e.target.closest("[data-idel]");if(dl){try{await post(`/api/items/${dl.dataset.idel}/delete`,{});refreshNetsView()}catch(err){alert(err.message)}return}
  const ie=e.target.closest("[data-iedit]");if(ie){const li=ie.closest("li.item"),i=findItem(+ie.dataset.iedit);if(li&&i)li.innerHTML=itemForm(i);return}
  if(e.target.closest("[data-icancel]")){const f=e.target.closest("form");if(f.dataset.ifid)refreshNetsView();else f.reset();return}
  const rm=e.target.closest("[data-attrm]");if(rm){saveMin({remove:rm.dataset.attrm});return}
  const cv=e.target.closest("[data-ctx]");if(cv){jumpTo(cv.dataset.ctx,cv.dataset.inst,cv.dataset.radio);return}
});
document.addEventListener("submit",async e=>{const f=e.target.closest(".iform");if(!f)return;e.preventDefault();
  const body=Object.fromEntries(["kind","text","who","due","event_at","until","place"].map(k=>[k,f[k].value]));
  try{if(f.dataset.ifid)await post(`/api/items/${f.dataset.ifid}`,body);else await post("/api/items",{...body,inst:NV.key});refreshNetsView()}
  catch(err){f.querySelector(".err").textContent=err.message}});
function findItem(id){const all=[...(MIN?MIN.items.concat(MIN.carried||[]):[]),...(OPEN_ITEMS||[])];return all.find(i=>i.id===id)}
let OPEN_ITEMS=[];
async function setItem(id,body){try{await post(`/api/items/${id}`,body);refreshNetsView()}catch(err){alert(err.message)}}
function refreshNetsView(){if($("netsDlg").open)renderNetsArea();if($("searchDlg").open)runSearch()}
function jumpTo(id,inst,radio){ // a transmission: in today's log on screen, else in its net's minutes
  const t=S.tx.find(x=>x.id===id);
  if(t){["netsDlg","searchDlg"].forEach(d=>{if($(d).open)$(d).close()});selectRadio(t.radio);
    const el=$("tx-"+id);if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}return}
  if(inst)openNetsArea({tab:"minutes",key:inst,hl:id});
}
document.addEventListener("change",async e=>{
  const c=e.target.closest("[data-listen]");if(!c)return;
  try{const r=await post(`/api/radios/${enc(c.dataset.listen)}/listen`,{[c.dataset.k]:c.checked});
    const i=S.radios.findIndex(x=>x.id===r.id);if(i>=0)S.radios[i]=r;renderRadios()}
  catch(err){c.checked=!c.checked;alert(err.message)}
});
$("openNets").onclick=()=>openNetsArea({tab:NV.tab||"schedule",radio:null});
$("netsClose").onclick=()=>$("netsDlg").close();
// ---------- search everything ----------
const SR={q:"",net:"",radio:"",from:"",to:"",call:""};
function openSearch(q){
  SR.q=q;const nets=S.schedule||[];
  $("searchBody").innerHTML=`<form id="srForm" class="srform" role="search"><input id="srQ" type="search" value="${esc(q)}" placeholder="Words, callsign, name, net…" aria-label="Search"><button class="primary">Search</button></form>
   <div class="srfilters small"><label>Net <select id="srNet"><option value="">any</option>${nets.map(n=>`<option value="${esc(n.id)}"${n.id===SR.net?" selected":""}>${esc(n.name)}</option>`).join("")}</select></label>
   <label>Radio <select id="srRadio"><option value="">any</option>${S.radios.map(r=>`<option value="${esc(r.id)}"${r.id===SR.radio?" selected":""}>${esc(r.name)}</option>`).join("")}</select></label>
   <label>From <input type="date" id="srFrom" value="${esc(SR.from)}"></label><label>To <input type="date" id="srTo" value="${esc(SR.to)}"></label>
   <label>Callsign <input id="srCall" class="up" maxlength="11" value="${esc(SR.call)}" placeholder="any"></label></div><div id="srRes" aria-live="polite"></div>`;
  const f=$("srForm");f.onsubmit=e=>{e.preventDefault();SR.q=$("srQ").value;runSearch()};
  ["srNet","srRadio","srFrom","srTo","srCall"].forEach(id=>$(id).onchange=()=>{SR.net=$("srNet").value;SR.radio=$("srRadio").value;SR.from=$("srFrom").value;SR.to=$("srTo").value;SR.call=$("srCall").value.trim().toUpperCase();runSearch()});
  if(!$("searchDlg").open)$("searchDlg").showModal();
  runSearch();
}
async function runSearch(){
  const box=$("srRes");if(!box)return;
  if(!SR.q.trim()&&!SR.call){box.innerHTML='<div class="empty">Search every transmission ever heard (live and accurate text), callsigns and callbook names, nets, and the minutes. Several words must all match; put words in "quotes" for an exact phrase. Narrow it with the filters.</div>';return}
  busy(box);
  const qs=new URLSearchParams({q:SR.q});for(const k of ["net","radio","from","to","call"])if(SR[k])qs.set(k,SR[k]);
  let d;try{d=await api("/api/search?"+qs)}catch(err){box.innerHTML=`<p class="err">${esc(err.message)}</p>`;return}
  OPEN_ITEMS=d.items;
  const tx=d.tx.map(t=>`<li class="sr"><div class="srh small"><span>${esc(fmtWhen(t.start))}</span> · <span>${esc(t.inst_kind==="net"?t.net_name:"Conversation")}</span>${t.speaker?` · <b>${esc(t.speaker)}</b>`:""} · <span class="muted">${esc((S.radios.find(r=>r.id===t.radio)||{}).name||t.radio)}</span></div>
     <div class="srt${t.noise?" muted":""}">${snip(t.snippet)}</div><div class="srb">${t.wav?`<button data-play="${esc(t.id)}">▶ ${t.duration_s?Math.round(t.duration_s)+" s":""}</button>`:""} <button data-ctx="${esc(t.id)}" data-inst="${esc(t.inst||"")}" data-radio="${esc(t.radio)}">Show in context ›</button></div></li>`).join("");
  const st=d.stations.map(s=>`<li class="sr"><span class="call" data-call="${esc(s.call)}">${esc(s.call)}</span> ${esc(s.name||"")} <span class="muted small">${esc([s.city,s.state].filter(Boolean).join(", "))}${s.times?` · took part ${s.times}×, last ${esc(fmtDay(s.last))}`:""}</span></li>`).join("");
  const nets=d.nets.map(n=>n.scheduled?`<li class="sr"><b>${esc(n.name)}</b> <span class="muted small">${esc(n.summary)}</span> <button data-goto="analysis" data-net="${esc(n.net_id)}">Who takes part</button> <button data-goto="history" data-net="${esc(n.net_id)}">History</button></li>`
     :`<li class="sr"><button class="linkish" data-mins="${esc(n.key)}">${esc(n.name)} · ${esc(fmtWhen(n.start))}</button> <span class="muted small">${n.stations} stations</span></li>`).join("");
  const its=d.items.map(i=>`<li class="sr"><span class="badge">${esc(KIND1[i.kind]||i.kind)}</span> ${snip(i.snippet)} <span class="muted small">${esc(i.inst_name||"Conversation")} · ${esc(fmtDay(i.occ_date||i.inst_start))}${i.status!=="open"?" · "+esc(i.status):""}</span> <button data-mins="${esc(i.inst)}">Minutes ›</button></li>`).join("");
  const grp=(t,n,body,more="")=>n?`<section class="srg"><h4>${t} <span class="muted">(${n})</span></h4><ul class="srl">${body}</ul>${more}</section>`:"";
  const none=!d.tx.length&&!d.stations.length&&!d.nets.length&&!d.items.length;
  box.innerHTML=none?`<div class="empty">Nothing found for <b>${esc(SR.q||SR.call)}</b>${SR.net||SR.radio||SR.from||SR.to||SR.call?" with these filters":""}. Try fewer words or the start of a callsign.</div>`
    :grp("Stations",d.stations.length,st)+grp("Nets",d.nets.length,nets)+grp("Minutes",d.items.length,its)+
     grp("Transmissions",d.tx_total,tx,d.tx_total>d.tx.length?`<p class="small muted">Showing the newest ${d.tx.length} of ${d.tx_total}. Add words or filters to narrow it.</p>`:"")+
     (d.fts?"":'<p class="small muted">Simple search (this PC\'s SQLite has no full-text index).</p>');
}
$("searchForm").addEventListener("submit",e=>{e.preventDefault();openSearch($("q").value.trim())});
$("searchClose").onclick=()=>$("searchDlg").close();
// ---------- the pre-net alert (station/alerts.py): banner on the radio's column + the header, chime, title, notification ----------
let CHIME=true;try{CHIME=localStorage.getItem("hamnet.chime")!=="0"}catch(e){}
const SEEN_ALERTS=new Set();let AUDIO=null,FLASH=null,BASE_TITLE=document.title;
function chime(){if(!CHIME)return;try{AUDIO=AUDIO||new (window.AudioContext||window.webkitAudioContext)();const t=AUDIO.currentTime;
  [[880,0],[1175,.18],[880,.36]].forEach(([f,d])=>{const o=AUDIO.createOscillator(),g=AUDIO.createGain();o.frequency.value=f;o.type="sine";
    g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.3);o.connect(g).connect(AUDIO.destination);o.start(t+d);o.stop(t+d+.32)})}catch(e){}}
const canNotify=()=>window.isSecureContext&&"Notification" in window;
function notify(a){if(canNotify()&&Notification.permission==="granted"){try{new Notification("HamNet Station",{body:a.text,tag:a.key})}catch(e){}}}
function alertWhen(a){return a.phase==="started"?`started at ${hhmm(a.start)}`:a.minutes<=1?`starts in 1 minute (${hhmm(a.start)})`:`starts in ${a.minutes} min (${hhmm(a.start)})`}
function alertBody(a){
  const f=a.freq_mhz?mhz(a.freq_mhz,a.mode):"";
  const msg=a.state==="already"?`Radio already on <b>${f}</b> — ready.`:a.state==="ready"?`Radio set${f?" to <b>"+f+"</b>":""} — ready.`
    :f?`Set <b>${esc(a.radio_name)}</b> to <b>${f}</b>${a.radio_freq_mhz?` <span class="muted">(logged now: ${mhz(a.radio_freq_mhz,a.radio_mode)})</span>`:""}.`:`Get <b>${esc(a.radio_name)}</b> ready.`;
  const o=a.open||{},parts=[["urgent","urgent"],["announcements","announcement"],["upcoming","coming up"],["actions","open action"],["traffic","traffic"]].filter(([k])=>o[k]).map(([k,l])=>`${o[k]} ${l}${o[k]>1&&!l.endsWith("up")?"s":""}`);
  const ro=parts.length?`<div class="aopen">Still open: ${parts.join(" · ")} <button class="linkish" data-goto="open" data-net="${esc(a.id)}">Read-out for net control ›</button></div>`
    :a.phase==="started"?`<div class="aopen muted">Nothing still open from earlier times. <button class="linkish" data-mins="${esc(a.key)}">Minutes ›</button></div>`:"";
  const btns=a.state==="due"?`<button class="primary" data-alert="${esc(a.key)}" data-act="ready">Radio is set</button> <button data-alert="${esc(a.key)}" data-act="snooze">Remind me in 1 min</button> <button data-alert="${esc(a.key)}" data-act="skip">Skip this net</button>`
    :`<button class="primary" data-alert="${esc(a.key)}" data-act="dismiss">OK</button> <button data-alert="${esc(a.key)}" data-act="skip">Skip this net</button>`;
  return `<div class="ah"><b>⏰ ${esc(a.name)}</b> ${alertWhen(a)}${a.moved?" · moved":""}${a.note?" · "+esc(a.note):""}</div><div class="am">${msg}</div>${ro}<div class="abtn">${btns} <button class="quiet chimeb" data-chime title="${CHIME?"Chime on: click to mute":"Chime muted: click to turn on"}" aria-label="${CHIME?"Mute the chime":"Turn the chime on"}">${CHIME?"🔔":"🔕"}</button></div>`}
function renderAlerts(){
  const list=S.alerts||[];
  $("alerts").innerHTML=list.map(a=>`<button class="astrip ${a.state}" data-ar="${esc(a.radio)}">⏰ <b>${esc(a.name)}</b> ${alertWhen(a)} on ${esc(a.radio_name)}${a.state==="due"&&a.freq_mhz?" · set "+mhz(a.freq_mhz,a.mode):a.state!=="due"?" · ready":""} ›</button>`).join("");
  for(const r of S.radios){const box=document.getElementById("ab-"+r.id);if(!box)continue;const mine=list.filter(a=>a.radio===r.id);
    box.innerHTML=mine.map(a=>`<div class="alertb ${a.state} ${a.phase}" role="status">${alertBody(a)}</div>`).join("");box.hidden=!mine.length}
  const fresh=list.filter(a=>a.state==="due"&&a.phase==="soon"&&!SEEN_ALERTS.has(a.key));
  if(fresh.length){chime();fresh.forEach(notify)}
  SEEN_ALERTS.clear();list.filter(a=>a.state==="due").forEach(a=>SEEN_ALERTS.add(a.key));
  const due=list.find(a=>a.state==="due");
  clearInterval(FLASH);document.title=BASE_TITLE;
  if(due){let on=false;FLASH=setInterval(()=>{on=!on;document.title=on?`⏰ ${due.name} ${due.phase==="started"?"now":"in "+due.minutes+" min"}`:BASE_TITLE},1000)}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-alert]");if(b){b.disabled=true;try{const d=await post(`/api/alerts/${enc(b.dataset.alert)}/${b.dataset.act}`,{});S.alerts=d.alerts;renderAlerts()}catch(err){alert(err.message);b.disabled=false}return}
  if(e.target.closest("[data-chime]")){CHIME=!CHIME;try{localStorage.setItem("hamnet.chime",CHIME?"1":"0")}catch(err){}if(CHIME)chime();renderAlerts();return}
  const s=e.target.closest("[data-ar]");if(s){selectRadio(s.dataset.ar);const box=$("ab-"+s.dataset.ar);if(box)box.scrollIntoView({block:"nearest"})}
});
// ---------- the Urgent board (emergency nets): pinned above the log of the radio it was heard on ----------
const URG_FOLD=new Set();
function renderUrgent(){
  const u=S.urgent||[];
  for(const r of S.radios){const box=document.getElementById("urg-"+r.id);if(!box)continue;const mine=u.filter(i=>i.radio===r.id);
    if(!mine.length){box.innerHTML="";box.hidden=true;continue}
    box.hidden=false;const f=URG_FOLD.has(r.id);
    box.innerHTML=`<div class="uh"><b>⚠ Urgent · ${mine.length} open</b> <span class="small">${esc([...new Set(mine.map(i=>i.inst_name||"Conversation"))].join(", "))}</span> <button class="quiet" data-urgfold="${esc(r.id)}" aria-expanded="${!f}">${f?"Show":"Hide"}</button></div>
     ${f?"":`<ul>${mine.map(i=>`<li><span class="cat">${esc(i.category||"urgent")}</span> <span class="ut">${esc(i.text)}</span> <span class="small">${hhmm(i.tx_start)}${i.by?" · "+esc(i.by):""}${i.place?" · "+esc(i.place):""}${(i.people||[]).filter(p=>p!==i.by).length?" · "+esc(i.people.filter(p=>p!==i.by).join(", ")):""}</span>
       <span class="ub"><button data-istatus="${i.id}" data-v="handled">Handled</button> <button data-src="${esc(i.tx_id||"")}" data-sinst="${esc(i.inst)}" data-radio="${esc(i.radio)}">Show ›</button></span></li>`).join("")}</ul>`}`}
}
document.addEventListener("click",e=>{const f=e.target.closest("[data-urgfold]");if(f){const id=f.dataset.urgfold;URG_FOLD.has(id)?URG_FOLD.delete(id):URG_FOLD.add(id);renderUrgent()}});
// Settings: the alert chime and system notifications
function renderAlertSettings(){
  const box=$("alertSet");if(!box)return;
  const why=!("Notification" in window)?"This browser cannot show notifications."
    :!window.isSecureContext?"Not available on this address: browsers allow notifications only on the station PC itself (http://localhost:8091) or over https. On a phone the banner works while the page is open; the chime needs one tap on the page first."
    :Notification.permission==="granted"?"On: alerts also appear as notifications when this window is in the background."
    :Notification.permission==="denied"?"Blocked in this browser's site settings. Allow notifications for this page there to turn them on.":"";
  box.innerHTML=`<label class="chk"><input type="checkbox" id="setChime"${CHIME?" checked":""}> Chime when a net alert comes up (remembered in this browser)</label>
   <div class="small">${canNotify()&&Notification.permission==="default"?'<button type="button" id="setNotif">Allow notifications</button> ':""}<span class="muted">${why}</span></div>`;
  $("setChime").onchange=e=>{CHIME=e.target.checked;try{localStorage.setItem("hamnet.chime",CHIME?"1":"0")}catch(err){}if(CHIME)chime();renderAlerts()};
  const n=$("setNotif");if(n)n.onclick=async()=>{await Notification.requestPermission();renderAlertSettings()};
}

connect();learnBadge();

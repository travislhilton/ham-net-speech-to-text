# Copy to config/station.yaml (the installer creates it with your callsign) and edit.
# The installer never overwrites station.yaml. Restart the station after editing:
#   Task Scheduler > HamNet Station > End, then Run (or sign out and back in).
callsign: N0CALL
qrz_online: true            # look up new callsigns on QRZ.com when online (needs hamkit.qrz set-login)
port: 8091
callfix: true               # correct near-miss callsigns ('WB6BQW' -> WB6DQW heard in this net); what was heard is kept
consensus: true             # one station, one call across a net: variants merged by FCC licence, name, town, history
# keep_awake: traffic        # laptops: full speed + screen on during nets and traffic (+10 min); listening / always / off
#                             # (README "On a laptop"; also Settings on the dashboard, which wins)
# VHF/UHF reach (300 km by default) is set in the dashboard: Settings → VHF/UHF reach.
# A schedule entry can say its name as net control says it, for the fix-ups (station/fixups.py):
#   spoken: [Springfield County ARES net]
# region_state: IL          # your state for callsign correction, when your licence address is elsewhere (default: FCC)
# station_lat: 39.80         # where the station is, for VHF/UHF callsign distances (default: your 6-character grid
# station_lon: -89.65        #   in Settings, else your licence's ZIP code centre)

radios:                     # one entry per radio; each needs its own sound input (never the VARA one)
  - id: ftm150              # short name used by the schedule
    name: Yaesu FTM-150R
    device: NET-REC         # part of the Windows recording device's name
    gate: carrier           # carrier = FM data jack (unsquelched hiss); voice = SSB/HF or squelched audio
    freq_mhz: 146.940       # starting value only: the operator sets it on the dashboard (Change) when retuning
    mode: FM
    # meter: {low_dbfs: -45, high_dbfs: -6, clip_dbfs: -1, dead_dbfs: -60, snr_good_db: 20, snr_fair_db: 10}
    # waterfall_hz: [0, 8000]   # default 0-8 kHz for FM (carrier gate), 0-4 kHz for voice gate
    # Segmenting (README "Segmenting"); the defaults shown are for the carrier gate, voice-gate defaults in brackets
    # preroll_ms: 500         # audio kept from before the gate opened [600]
    # hangover_ms: 900        # the gate stays closed this long before a transmission ends [900]
    # min_speech_ms: 400      # shorter is a kerchunk, dropped unless merged [400]
    # split_pause_ms: 800     # carrier gate: also cut at speech pauses this long (repeater hang time); 0 = off [0]
    # dip_split_ms: 96        # a carrier dip this long (squelch tail) is a turn boundary; 0 = off [0]
    # merge_gap_ms: 0         # a short piece waits this long after the hangover for its continuation; 0 = off [600]
    # merge_max_s: 3.0        # ... only pieces with less speech than this [3.0]
    # highpass_hz: 300        # carrier gate: remove the sub-audible tone and hum before Whisper; 0 = off
  # - id: ic705
  #   name: Icom IC-705
  #   device: "IC-705"      # Icom Remote Utility's "IC-705 (Icom Virtual Audio Driver)"; "file:C:\\path\\to.wav" plays a test file
  #   gate: voice
  #   freq_mhz: 7.185
  #   mode: LSB

# Nets: which radio, which frequency, when (local time). These are the STARTING nets only: once a net is
# added, changed or deleted on the dashboard (Nets), the schedule lives in data\schedule.json and this
# list is no longer read (delete data\schedule.json to start again from here). "Listen only during
# scheduled nets" is a per-radio switch in that window (kept in data\operator.json).
schedule:
  - name: Example County ARES Net
    radio: ftm150           # a radio id from radios: above
    freq_mhz: 146.940       # optional; the alert says "set it to 146.940 MHz", and the dashboard warns when it differs
    mode: FM                # optional; FM, USB, LSB, AM, CW or DIG
    start: "20:00"
    duration_min: 60        # 1 to 1440
    ncs: K7NET              # net control station: suggested phrases, the speaker of its acknowledgements, the minutes
    repeat: {freq: weekly, weekdays: [Tue]}
    # alert_min: 5          # the pre-net alert, minutes before (default 5; 0 = none)
    # emergency: true       # an emergency / priority net: keeps an Urgent board for it
  # More repeat rules (the dashboard's Repeats editor writes these; all optional keys shown):
  #   repeat: {freq: once, starts: "2026-12-05"}                            # one time only
  #   repeat: {freq: daily}                                                 # every day
  #   repeat: {freq: weekly, weekdays: [Mon, Tue, Wed, Thu, Fri]}           # every weekday
  #   repeat: {freq: weekly, interval: 2, weekdays: [Tue, Thu], starts: "2026-11-03"}   # every 2 weeks (needs starts)
  #   repeat: {freq: monthly, monthday: 15}                                 # the 15th of every month
  #   repeat: {freq: monthly, monthday: -1}                                 # the last day of every month
  #   repeat: {freq: monthly, nth: [1, 3], weekdays: [Sun]}                 # the 1st and 3rd Sunday
  #   repeat: {freq: monthly, nth: [-1], weekdays: [Fri]}                   # the last Friday
  #   repeat: {freq: yearly, month: 6, nth: [4], weekdays: [Sat]}           # Field Day: 4th Saturday of June
  #   ... until: "2027-06-30"   or   count: 10 (with starts)                # when it ends (default: never)
  # One date changed (the dashboard's Skip / Move... write these), keyed by the date it would have met:
  #   exceptions: {"2026-12-01": {cancel: true, note: Hamfest}, "2026-12-15": {date: "2026-12-16", start: "19:30"}}
  # Older lists like `days: [Tue, Thu]` still work (read as a weekly rule).

# The end of a net: when net control closes it on the air ("we'll go ahead and close the net", "this net is now
# closed"), keep recording this many minutes for the 73s, then pause the radio if the station turned it on for the
# net, and start the final accurate pass at once. End net on the dashboard does the same at once.
close_tail_min: 2
# close_detect: false       # do not listen for net control closing the net (End net still works)

accurate:                   # the accurate second pass: the home server when reachable, else THIS PC
  urls: [http://192.168.1.20:8090, http://my-server:8090]   # your accurate-pass server(s), tried in order
  local: auto               # this PC's spare compute when there is no home server (key or network): auto = what the
                            # installer's benchmark found (engine.yaml accurate:), final_only = only the final text
                            # after each net, off = never on this PC
  local_on_battery: false   # laptops: no local pass while on battery
  # quiet_s: 2              # the local pass waits this long after the live text last needed the PC
  # unload_after_min: 10    # the local model leaves memory after this many idle minutes
  live: true                # re-transcribe each transmission as soon as its live text is done (provisional text,
                            # heard with the ~25 s of the net before it)
  context: true             # hear transmissions in their place in the net (an older Mac service: one at a time)
  final_after_min: 2        # the final text for the whole net, this many quiet minutes after it
  auto_after_min: 15        # catch-up for anything missed, this many quiet minutes after a net; 0 = off
  # the key goes in config\secrets.env as EMCOMM_STT_KEY=... (never in this file; kept across updates)

# The download link printed on the reference card (Help) with its QR code, for people you train. Default: the public
# project page, https://github.com/travislhilton/ham-net-speech-to-text; set your club's own copy here, or "" to print "ask the instructor" instead.
# download_url: https://github.com/travislhilton/ham-net-speech-to-text

# A net still being heard after its scheduled end keeps going (recording, its own transmissions) until net control
# closes it, it is quiet this many minutes, or just before the next net on the same radio; at most overrun_max_min.
# overrun_quiet_min: 5
# overrun_max_min: 180

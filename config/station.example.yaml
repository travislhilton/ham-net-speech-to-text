# Copy to config/station.yaml (the installer creates it with your callsign) and edit.
# The installer never overwrites station.yaml. Restart the station after editing:
#   Task Scheduler > HamNet Station > End, then Run (or sign out and back in).
callsign: W9XYZ
qrz_online: true            # look up new callsigns on QRZ.com when online (needs hamkit.qrz set-login)
port: 8091
callfix: true               # correct near-miss callsigns ('WB6BQW' -> WB6DQW heard in this net); what was heard is kept
# region_state: IL          # your state for callsign correction, when your licence address is elsewhere (default: FCC)

radios:                     # one entry per radio; each needs its own sound input (never the VARA one)
  - id: ftm150              # short name used by the schedule
    name: Yaesu FTM-150R
    device: NET-REC         # part of the Windows recording device's name
    gate: carrier           # carrier = FM data jack (unsquelched hiss); voice = SSB/HF or squelched audio
    freq_mhz: 146.940       # starting value only: the operator sets it on the dashboard (Change) when retuning
    mode: FM
    # meter: {low_dbfs: -45, high_dbfs: -6, clip_dbfs: -1, dead_dbfs: -60, snr_good_db: 20, snr_fair_db: 10}
    # waterfall_hz: [0, 8000]   # default 0-8 kHz for FM (carrier gate), 0-4 kHz for voice gate
    # split_pause_ms: 800     # carrier gate: also cut at speech pauses this long (repeater hang time); 0 = off
    # highpass_hz: 300        # carrier gate: remove the sub-audible tone and hum before Whisper; 0 = off
  # - id: ic705
  #   name: Icom IC-705
  #   device: "IC-705"      # Icom Remote Utility's "IC-705 (Icom Virtual Audio Driver)"; "file:C:\\path\\to.wav" plays a test file
  #   gate: voice
  #   freq_mhz: 7.185
  #   mode: LSB

# Nets: which radio, which frequency, when (local time). These are the STARTING nets only: once a net is
# added, changed or deleted on the dashboard (Nets...), the schedule lives in data\schedule.json and this
# list is no longer read (delete data\schedule.json to start again from here). "Listen only during
# scheduled nets" is a per-radio switch in that dialog (kept in data\operator.json).
schedule:
  - name: Springfield Valley ARES net
    radio: ftm150           # a radio id from radios: above
    freq_mhz: 146.940       # optional; the dashboard warns when the radio is set to something else
    # mode: FM              # optional; FM, USB, LSB, AM, CW or DIG (used by "log at the net's frequency")
    days: [Tue]             # any of Mon Tue Wed Thu Fri Sat Sun
    start: "20:00"
    duration_min: 60        # 1 to 1440
    ncs: WA7XQZ             # net control station: suggested phrases, and the speaker of its acknowledgements

accurate:                   # the accurate second pass on the home server (optional; home network only)
  urls: [http://192.168.1.54:8090, http://home-server:8090]   # tried in order
  live: true                # re-transcribe each transmission as soon as its live text is done
  auto_after_min: 15        # catch-up for anything missed, this many quiet minutes after a net; 0 = off
  # the key goes in config\secrets.env as EMCOMM_STT_KEY=... (never in this file; kept across updates)

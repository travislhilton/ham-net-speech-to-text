# Vocabulary fed to Whisper's initial_prompt and used by callsigns.py normalization.
# Edit freely; keep callsigns upper-case.
#
# Private roster additions (names, personal callsigns you'd rather not publish) go in
# config/local.yaml — git-ignored, same keys; lists are merged, scalars override.
#
# Whisper only keeps the LAST ~224 tokens of the prompt, so callsigns.initial_prompt()
# puts tacticals and stations last. Keep `phrases` tight.

area: >-
  Amateur radio voice net. Put your county, towns, club and EOC names in config/local.yaml.

phrases:
  - net control
  - this is net control
  - the net is now open
  - the net is closed
  - check in
  - checking in
  - no traffic
  - with traffic
  - routine traffic
  - welfare traffic
  - priority traffic
  - emergency traffic
  - break
  - break break
  - go ahead
  - say again
  - affirmative
  - negative
  - roger
  - copy
  - over
  - out
  - clear
  - standing by
  - relay
  - please copy
  - QSL
  - QRZ
  - QRT
  - ICS 213
  - ICS 309
  - Winlink
  - VARA FM
  - simplex
  - repeater
  - emergency power
  - acknowledge

tacticals:
  - Net Control
  - Shelbyville EOC
  - Shelbyville County EOC
  - Stake Center EOC
  - Satellite EOC
  - Area EOC
  - Council Area EOC

# Repeaters likely heard on the net (callsign IDs and frequencies) and the net's roster: yours go in
# config/local.yaml (git-ignored, same keys), for example:
#   repeaters:
#     - {callsign: K7ABC, output_mhz: 146.940, note: main ARES repeater}
#   roster: [K7ABC, W9XYZ]
repeaters: []
roster: []

# Fix-ups applied to the text AFTER transcription (station/fixups.py; never put in Whisper's prompt, which made it
# echo the prompt). Each: heard (whole words, any case) -> say; `context` = a regex that must match elsewhere in the
# same sentence. Your area, club and net names go in config/local.yaml under the same key, for example
#   fixups:
#     - {heard: Springfeld, say: Springfield}
#   net_names: ["Springfield County ARES net"]     # the net's name as net control says it (repaired by sound)
# Pairs the dashboard learns from your corrections are read from data/fixups_learned.yaml (same format).
fixups:
  - {heard: Aries, say: ARES, context: '\b(net|nets|members?|county|emergency|EOC|amateur|radio|check(ing)? ?in|volunteers?|team|group|club|exercise|drill|coordinator|RACES|ham)\b'}
  - {heard: Ares, say: ARES, context: '\b(net|nets|members?|county|emergency|EOC|amateur|radio|check(ing)? ?in|volunteers?|team|group|club|exercise|drill|coordinator|RACES|ham)\b'}
  - {heard: A.R.E.S., say: ARES}
  - {heard: Windlink, say: Winlink}
  - {heard: Wind link, say: Winlink}
  - {heard: Win link, say: Winlink}
  - {heard: nest control, say: net control}
  - {heard: neck control, say: net control}
  - {heard: nett control, say: net control}
  - {heard: Vera FM, say: VARA FM}
